{% extends "base.html" %}
{% block title %}Congratulations!{% endblock %}
{% block content %}
<h1>Congratulations, {{ username }}!</h1>
<p>You completed all riddles! Your score: <strong>{{ score }}</strong></p>
<!-- SECURITY [SR-3]: CSRF token on view highscores form -->
<form method="POST" action="{{ url_for('congrats', username=username) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="submit" value="View Highscores">
</form>
{% endblock %}
