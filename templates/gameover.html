{% extends "base.html" %}
{% block title %}Game Over{% endblock %}
{% block content %}
<h1>Game Over, {{ username }}</h1>
<p>Better luck next time!</p>
<!-- SECURITY [SR-3]: CSRF token on replay form -->
<form method="POST" action="{{ url_for('gameover', username=username) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="submit" value="Try Again">
</form>
{% endblock %}
