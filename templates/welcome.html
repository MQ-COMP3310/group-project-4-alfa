{% extends "base.html" %}
{% block title %}Welcome, {{ username }}{% endblock %}
{% block content %}
<h1>Welcome, {{ username }}!</h1>
<p>Ready to test your wits? You'll face 10 riddles — 3 attempts each.</p>
<!-- SECURITY [SR-3]: CSRF token required on POST -->
<form method="POST" action="{{ url_for('user', username=username) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="submit" value="Start Game">
</form>
{% endblock %}
